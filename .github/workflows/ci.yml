name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap build tools
        run: sh tui/scripts/bootstrap.sh

      - name: Configure
        run: meson setup build

      - name: Build
        run: ninja -C build
