name: Release

on:
  push:
    branches:
      - main

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git fetch --tags
          current=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          current=${current#v}
          version=$(sh tui/scripts/next-version.sh "$current")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: compute-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap
        run: sh tui/scripts/bootstrap.sh

      - name: Configure
        run: meson setup build -Dcompile_app=false -Dcompile_server=false -Dcompile_tui=true

      - name: Build
        run: ninja -C build

      - name: Package
        run: |
          DIR="scrcpy-tui_${VERSION}_linux"
          mkdir "$DIR"
          cp build/tui/scrcpy-tui "$DIR/"
          cp README.md LICENSE NOTICE "$DIR/"
          tar -czf "${DIR}.tar.gz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-tui_${{ env.VERSION }}_linux
          path: scrcpy-tui_${{ env.VERSION }}_linux.tar.gz
          if-no-files-found: error

  build-windows:
    needs: compute-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Bootstrap
        run: bash tui/scripts/bootstrap-msys2.sh

      - name: Configure
        run: meson setup build --wipe -Dcompile_app=false -Dcompile_server=false -Dcompile_tui=true

      - name: Build
        run: ninja -C build

      - name: Bundle adb
        run: |
          curl -L -o build/platform-tools-latest-windows.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          rm -rf build/platform-tools
          unzip -q -o build/platform-tools-latest-windows.zip -d build
          cp build/platform-tools/adb.exe build/platform-tools/AdbWinApi.dll build/platform-tools/AdbWinUsbApi.dll build/tui/

      - name: Package
        shell: pwsh
        run: |
          $dir = "scrcpy-tui_${env:VERSION}_windows"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item build\tui\scrcpy-tui.exe, build\tui\adb.exe, build\tui\AdbWinApi.dll, build\tui\AdbWinUsbApi.dll, README.md, LICENSE, NOTICE -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "${dir}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-tui_${{ env.VERSION }}_windows
          path: scrcpy-tui_${{ env.VERSION }}_windows.zip
          if-no-files-found: error

  release:
    needs:
      - compute-version
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-tui_${{ env.VERSION }}_linux
          path: .

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-tui_${{ env.VERSION }}_windows
          path: .

      - name: Create tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: |
            scrcpy-tui_${{ env.VERSION }}_linux.tar.gz
            scrcpy-tui_${{ env.VERSION }}_windows.zip
          generate_release_notes: true
